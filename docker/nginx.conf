worker_processes 1;
pid /run/temporal/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /run/temporal/client;
    proxy_temp_path /run/temporal/proxy;
    fastcgi_temp_path /run/temporal/fastcgi;
    uwsgi_temp_path /run/temporal/uwsgi;
    scgi_temp_path /run/temporal/scgi;
    server {
        listen 8080;
        server_name _;
        auth_basic "Temporal demo";
        auth_basic_user_file /run/temporal/htpasswd;
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization "";
            proxy_read_timeout 65s;
        }
    }
}
